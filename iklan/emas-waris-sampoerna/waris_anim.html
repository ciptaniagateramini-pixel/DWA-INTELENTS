<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Pop;src:url(Poppins-Bold.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;background:#140205}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;color:#fff;
  background:radial-gradient(ellipse at 50% 42%,#7a0f1c 0%,#3d050c 45%,#140205 100%)}
#floor{position:absolute;left:-400px;right:-400px;top:1180px;height:1200px;transform:perspective(900px) rotateX(72deg);transform-origin:50% 0;
  background-image:linear-gradient(rgba(232,195,90,.18) 2px,transparent 2px),linear-gradient(90deg,rgba(232,195,90,.18) 2px,transparent 2px);background-size:90px 90px;
  -webkit-mask-image:linear-gradient(#000,transparent 70%)}
.abs{position:absolute}
.gold{color:#F2CB5B}
#hdr{left:0;right:0;top:120px;text-align:center}
#kick{display:inline-block;font-family:Pop;font-size:34px;color:#3d050c;background:linear-gradient(#ffe08a,#d9a531);padding:6px 28px;border-radius:40px;margin-bottom:18px}
#ttl{font-family:Pop;font-size:76px;line-height:1.08;text-shadow:0 6px 20px rgba(0,0,0,.5)}
#ttl b{font-weight:normal;background:linear-gradient(#fff3c4,#F2CB5B 45%,#b9861d);-webkit-background-clip:text;color:transparent}
#cap{left:70px;right:70px;top:1560px;text-align:center;font-size:40px;line-height:1.4;font-weight:600;color:#f3dfe0}
#cap b{color:#F2CB5B}
#sub{left:90px;right:90px;top:1745px;text-align:center}
#sub span{display:inline-block;max-width:900px;font-size:29px;line-height:1.35;font-weight:600;color:rgba(255,255,255,.92);background:rgba(0,0,0,.35);padding:8px 18px;border-radius:12px}
#src{left:0;right:0;bottom:40px;text-align:center;font-size:24px;color:rgba(255,255,255,.45)}
/* 3D gold card */
.scene3d{position:absolute;left:0;right:0;top:420px;height:1060px;perspective:1600px}
.card{position:absolute;left:50%;top:50%;width:560px;height:855px;margin:-427px 0 0 -280px;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:34px;overflow:hidden;backface-visibility:hidden}
.face img{width:100%;height:100%;object-fit:cover}
.back{transform:rotateY(180deg)}
.edge{position:absolute;inset:0;border-radius:34px;background:#8c0f1d}
.shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 47%,transparent 58%);mix-blend-mode:screen}
.shadow{position:absolute;left:50%;top:960px;width:600px;height:80px;margin-left:-300px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.6),transparent 70%)}
.chip{position:absolute;display:flex;align-items:center;gap:16px;padding:18px 28px;border-radius:24px;
  background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:2px solid rgba(242,203,91,.55);
  box-shadow:0 20px 40px rgba(0,0,0,.45);backdrop-filter:blur(6px);font-family:Pop;font-size:38px}
.chip i{font-style:normal;width:56px;height:56px;border-radius:16px;background:linear-gradient(#ffe08a,#c99325);color:#3d050c;display:flex;align-items:center;justify-content:center;font-size:30px}
.chip small{display:block;font-family:Inter;font-weight:600;font-size:24px;color:#f0d9da}
/* phone */
.pwrap{position:absolute;left:232px;top:430px;width:616px;height:1065px;perspective:1800px}
.phone{position:absolute;inset:0;border-radius:84px;background:linear-gradient(145deg,#2b2b2e,#0c0c0e);transform-style:preserve-3d;
  box-shadow:0 0 0 4px #4a3a2a,0 60px 120px rgba(0,0,0,.7)}
.scr{position:absolute;left:20px;top:20px;width:576px;height:1024px;border-radius:66px;overflow:hidden;background:#fff}
.scr .pg{position:absolute;left:0;width:576px}
.island{position:absolute;left:228px;top:40px;width:160px;height:44px;border-radius:24px;background:#000;z-index:9}
.glare{position:absolute;inset:0;border-radius:84px;background:linear-gradient(120deg,rgba(255,255,255,.12),transparent 40%);pointer-events:none}
.tap{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:rgba(242,203,91,.5);border:5px solid #F2CB5B;z-index:20}
.hl{position:absolute;border:5px solid #F2CB5B;border-radius:14px;box-shadow:0 0 0 8px rgba(242,203,91,.25);z-index:19}
.badge{position:absolute;z-index:30;padding:20px 26px;border-radius:22px;background:linear-gradient(145deg,#fff8e1,#f4d27a);color:#3d050c;font-family:Pop;font-size:30px;line-height:1.25;box-shadow:0 24px 50px rgba(0,0,0,.5)}
.badge small{display:block;font-family:Inter;font-weight:600;font-size:22px;color:#6b1a20}
/* bars */
.bars{position:absolute;left:0;right:0;top:470px;height:900px;perspective:1400px}
.bar3{position:absolute;bottom:0;transform-style:preserve-3d}
.bar3 .f{position:absolute;inset:0;background:linear-gradient(90deg,#f7d778,#d39f2c 60%,#a8761a)}
.bar3 .s{position:absolute;top:0;right:-60px;width:60px;height:100%;background:linear-gradient(#a8761a,#6e4a0b);transform:skewY(-40deg);transform-origin:0 0}
.bar3 .t{position:absolute;top:-50px;left:0;width:100%;height:50px;background:linear-gradient(90deg,#fff1b8,#e8bf55);transform:skewX(-50deg);transform-origin:0 100%}
.lbl{position:absolute;text-align:center;font-family:Pop}
/* map */
#mapwrap{position:absolute;left:0;right:0;top:470px;height:1000px;perspective:1300px}
#map{position:absolute;left:-113px;top:-60px;width:1400px;height:700px;transform:rotateX(40deg);transform-style:preserve-3d;transform-origin:50% 60%}
.pin{position:absolute;transform-origin:50% 100%}
.pin .head{width:84px;height:84px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:linear-gradient(135deg,#ffe08a,#c58f22);box-shadow:0 10px 20px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.pin .head span{transform:rotate(45deg);width:30px;height:30px;border-radius:50%;background:#7a0f1c}
.mcard{position:absolute;width:440px;padding:22px 24px;border-radius:24px;background:linear-gradient(145deg,#fff8e8,#f3dfb3);color:#3d050c;box-shadow:0 26px 50px rgba(0,0,0,.55);font-size:24px;line-height:1.35;font-weight:600}
.mcard h3{font-family:Pop;font-size:36px;font-weight:normal;margin-bottom:6px;color:#7a0f1c}
