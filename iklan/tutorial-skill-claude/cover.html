<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Pop;src:url(Poppins-Bold.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;background:#000607}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;background:linear-gradient(#002629,#000607);font-family:Pop;color:#fff}
#grid{position:absolute;inset:0;background-image:linear-gradient(#185759 2px,transparent 2px),linear-gradient(90deg,#185759 2px,transparent 2px);
  background-size:60px 60px;opacity:.6;-webkit-mask-image:linear-gradient(#000 0%,rgba(0,0,0,.35) 45%,transparent 85%)}
#glow{position:absolute;left:90px;top:520px;width:900px;height:900px;border-radius:50%;background:radial-gradient(rgba(232,182,60,.22),transparent 65%)}
#logo{position:absolute;left:0;right:0;top:150px;text-align:center;font-size:96px;line-height:1;color:#E8B63C;letter-spacing:3px}
#logo span{border-bottom:9px solid #E8B63C;padding-bottom:4px}
#sub{position:absolute;left:0;right:0;top:310px;text-align:center;font-size:40px;color:#fff;letter-spacing:.5px}
#sub i{font-style:normal;color:#E8B63C;margin:0 18px}
.phone{position:absolute;left:232px;top:430px;width:616px;height:1065px;border-radius:84px;background:#0d1314;box-shadow:0 0 0 4px #2a3b3d,0 50px 100px rgba(0,0,0,.7)}
.btn{position:absolute;background:#2a3b3d;border-radius:4px}
.island{position:absolute;left:228px;top:40px;width:160px;height:44px;border-radius:24px;background:#000;z-index:9}
.scr{position:absolute;left:20px;top:20px;width:576px;height:1024px;border-radius:66px;overflow:hidden;
  background:radial-gradient(circle at 50% 62%,#1f6b6e 0%,#08444a 45%,#032a2e 100%)}
.rays{position:absolute;left:-312px;top:-200px;width:1200px;height:1200px;
  background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(232,182,60,.16) 0deg 7deg,transparent 7deg 20deg);
  -webkit-mask-image:radial-gradient(circle,#000 20%,transparent 70%)}
.hook{position:absolute;left:0;right:0;top:112px;text-align:center}
.big{font-size:150px;line-height:.95;color:#E8B63C;letter-spacing:-2px;
  text-shadow:0 6px 0 #6b4a05,0 14px 30px rgba(0,0,0,.45)}
.l2{font-size:44px;line-height:1.15;margin-top:12px;text-shadow:0 4px 12px rgba(0,0,0,.5)}
.l2 b{color:#E8B63C;font-weight:normal}
.jadi{position:absolute;left:0;right:0;top:392px;text-align:center;font-size:58px;color:#fff;text-shadow:0 4px 14px rgba(0,0,0,.5)}
.card{position:absolute;width:228px;height:405px;border-radius:26px;overflow:hidden;border:6px solid #fff;box-shadow:0 22px 44px rgba(0,0,0,.55)}
.card img{width:100%;height:100%;object-fit:cover}
.arrow{position:absolute;left:258px;top:470px;font-size:56px;color:#E8B63C}
.pillin{position:absolute;left:0;right:0;top:912px;white-space:nowrap;text-align:center}
.pillin span{display:inline-block;background:#fff;color:#08444a;font-size:33px;padding:12px 30px;border-radius:40px;box-shadow:0 10px 24px rgba(0,0,0,.4)}
#cap{position:absolute;left:0;right:0;top:1535px;text-align:center;font-family:Inter,sans-serif;font-weight:600;font-size:38px;color:#c9d6d7}
#pill{position:absolute;left:0;right:0;top:1616px;text-align:center}
#pill span{display:inline-block;height:84px;line-height:86px;padding:0 64px;border-radius:50px;background:#E8B63C;color:#002629;font-size:44px}
</style></head><body><div id="st">
<div id="grid"></div><div id="glow"></div>
<div id="logo"><span>TS</span></div>
<div id="sub">Jasa Video Iklan<i>|</i>Konten</div>
<div class="phone">
  <div class="btn" style="left:-8px;top:220px;width:6px;height:90px"></div>
  <div class="btn" style="right:-8px;top:260px;width:6px;height:140px"></div>
  <div class="island"></div>
  <div class="scr">
    <div class="rays"></div>
    <div class="hook"><div class="big">26rb</div><div class="l2">di tangan yang <b>tepaaat</b></div></div>
    <div class="jadi">Jadi ini. 👇</div>
    <div class="card" style="left:44px;top:486px;transform:rotate(-7deg)"><img src="abona.jpg"></div>
    <div class="card" style="left:304px;top:486px;transform:rotate(7deg)"><img src="jengkol.jpg"></div>
    <div class="pillin"><span>Berguna buat bisnis kamu.</span></div>
  </div>
</div>
<div id="cap">Contoh karya video iklan</div>
<div id="pill"><span>Klik link di bio</span></div>
</div></body></html>
