<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>bb gold Flat Motion</title>
<style>
  @font-face { font-family: Poppins; font-weight: 700; font-style: normal; src: url(/assets/fonts/Poppins-Bold.woff2) format("woff2"); }
  @font-face { font-family: Poppins; font-weight: 700; font-style: italic; src: url(/assets/fonts/Poppins-BoldItalic.woff2) format("woff2"); }
  @font-face { font-family: Poppins; font-weight: 500; font-style: normal; src: url(/assets/fonts/Poppins-Medium.woff2) format("woff2"); }
  @font-face { font-family: Poppins; font-weight: 300; font-style: normal; src: url(/assets/fonts/Poppins-Light.woff2) format("woff2"); }
  html, body { margin: 0; padding: 0; background: var(--mustard); overflow: hidden; }
  * { box-sizing: border-box; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--mustard);
           font-family: Poppins, sans-serif; color: var(--biru); -webkit-font-smoothing: antialiased; }
  #camera { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
  .scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  /* Kolom konten mengikuti zona aman: kiri 90, kanan 120 */
  .kolom { position: absolute; left: var(--safe-left); width: calc(1080px - var(--safe-left) - var(--safe-right)); }
  .tengah { text-align: center; }
  .kunci { font-weight: 700; font-size: var(--kata-kunci); line-height: 1; letter-spacing: -0.01em; }
  .judul { font-weight: 700; font-size: var(--judul); line-height: 1.12; }
  .miring { font-weight: 700; font-style: italic; }
  .pendukung { font-weight: 500; font-size: var(--pendukung); line-height: 1.3; }
  .label { font-weight: 300; font-size: var(--label); letter-spacing: var(--label-spacing); text-transform: uppercase; }
  .kartu { background: var(--krem); border-radius: 44px; }
  .ib { display: inline-block; }
</style>
</head>
<body>
<div id="stage">
  <div id="camera"><div id="world"></div></div>
  <div id="overlay" class="layer"></div>
</div>
<script type="module">
  import { boot } from "/engine/engine.js";
  const q = new URLSearchParams(location.search);
  boot(q.get("data"), { cover: q.has("cover"), grid: q.has("grid") });
</script>
</body>
</html>
