<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>bb gold Logo Outro</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
  import { loadLogo, prepareText, FPS, DURATION } from "/logo-outro/logo.js";
  import { makeRenderer } from "/logo-outro/blur.js";
  const canvas = document.getElementById("c");
  const font = new FontFace("Poppins", "url(/assets/fonts/Poppins-Bold.woff2)", { weight: "700" });
  document.fonts.add(await font.load());
  await loadLogo("/assets/logo/bb-gold-profil-ring-mustard.svg");
  const text = prepareText(canvas.getContext("2d"));
  const render = makeRenderer(canvas);
  window.renderFrame = (t, background) => { render(t, { background }); return canvas.toDataURL("image/png"); };
  window.__meta = { fps: FPS, duration: DURATION, text };
  window.__ready = true;
</script>
</body>
</html>
