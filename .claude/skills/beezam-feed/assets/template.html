<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F7EBD0}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:#F7EBD0;font-family:"poppins",sans-serif;color:#2B1A04}
.abs{position:absolute}
.brand{left:0;top:84px;width:1080px;text-align:center;font-weight:600;font-size:26px;letter-spacing:12px;color:#9A6A12}
.title{left:0;top:128px;width:1080px;text-align:center;font-weight:800;font-size:96px;line-height:1.05;color:#2B1A04}
.sub{left:0;top:246px;width:1080px;text-align:center;font-weight:500;font-size:34px;color:#5A3A0A}

.tagL{left:70px;top:610px;font-weight:600;font-size:24px;line-height:1.3;color:#2B1A04;background:#FFFFFF;padding:14px 22px;border-radius:18px}
.tagL span{display:block;font-weight:800;font-size:34px;color:#C27A00}
.tagR{left:800px;top:760px;font-weight:600;font-size:24px;line-height:1.3;color:#2B1A04;background:#FFFFFF;padding:14px 22px;border-radius:18px}
.tagR span{display:block;font-weight:800;font-size:34px;color:#C27A00}
</style></head>
